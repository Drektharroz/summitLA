<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 220" role="img"
     aria-label="Summit Legal Advisors">
  <!-- Línea decorativa superior -->
  <line x1="40" y1="28" x2="340" y2="28"
        stroke="#C9A84C" stroke-width="0.75" stroke-opacity="0.5"/>

  <!-- Wordmark principal -->
  <text x="190" y="110"
        text-anchor="middle"
        font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
        font-size="72"
        font-weight="600"
        letter-spacing="10"
        fill="#E8C87A">SUMMIT</text>

  <!-- Separador central -->
  <line x1="120" y1="130" x2="260" y2="130"
        stroke="#C9A84C" stroke-width="0.5" stroke-opacity="0.6"/>

  <!-- Subtítulo -->
  <text x="190" y="160"
        text-anchor="middle"
        font-family="'Inter', Arial, sans-serif"
        font-size="17"
        font-weight="500"
        letter-spacing="9"
        fill="#E8E6E1">LEGAL ADVISORS</text>

  <!-- Línea decorativa inferior -->
  <line x1="40" y1="192" x2="340" y2="192"
        stroke="#C9A84C" stroke-width="0.75" stroke-opacity="0.5"/>
</svg>
