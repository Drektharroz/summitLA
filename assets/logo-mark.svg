<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Summit Legal Advisors - S Monogram Mark -->
  <g transform="translate(100,100)">
    <!-- Main S curve -->
    <path d="M2,-78 C42,-78 56,-62 56,-44 C56,-22 34,-12 8,-1 C-18,10 -42,22 -42,48 C-42,68 -24,80 14,80" stroke="#1a1a1a" stroke-width="14" fill="none" stroke-linecap="round"/>
    <!-- Upper crescent -->
    <path d="M-22,-76 C-22,-76 -46,-64 -46,-44 C-46,-28 -30,-20 -24,-17" stroke="#1a1a1a" stroke-width="10" fill="none" stroke-linecap="round"/>
    <!-- Central stem -->
    <line x1="0" y1="-42" x2="0" y2="42" stroke="#1a1a1a" stroke-width="2"/>
    <!-- Top serif -->
    <line x1="-8" y1="-42" x2="8" y2="-42" stroke="#1a1a1a" stroke-width="2"/>
    <!-- Bottom serif -->
    <line x1="-7" y1="42" x2="7" y2="42" stroke="#1a1a1a" stroke-width="2"/>
    <!-- Pedestal -->
    <path d="M-5,42 L0,50 L5,42" stroke="#1a1a1a" stroke-width="1.5" fill="none"/>
  </g>
</svg>
